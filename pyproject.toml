[project]
name = "hooklens"
version = "0.1.0"
description = "See what your coding agents do: tool calls, commands, files, and tokens from Claude Code, Codex, and Cursor, stored on your machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Kunal-5402/hooklens"
Issues = "https://github.com/Kunal-5402/hooklens/issues"

[project.scripts]
hooklens = "hooklens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hooklens"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
