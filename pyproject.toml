[project]
name = "hooklens"
dynamic = ["version"]  # read from src/hooklens/__init__.py
description = "See what your coding agents do: tool calls, commands, files, and tokens from Claude Code, Codex, and Cursor, stored on your machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["claude-code", "codex", "cursor", "ai-agents", "observability", "telemetry", "hooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Kunal-5402/hooklens"
Issues = "https://github.com/Kunal-5402/hooklens/issues"

[project.scripts]
hooklens = "hooklens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hooklens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hooklens"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The version lives in __init__.py, so a change there must refresh the installed package metadata.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/hooklens/__init__.py" }]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
