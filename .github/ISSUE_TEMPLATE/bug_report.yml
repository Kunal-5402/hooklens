name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. hooklens install
        2. Start a Claude Code session and ...
        3. hooklens show
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options:
        - Claude Code
        - Codex
        - Cursor
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `hooklens --version`, and the agent version.
      placeholder: hooklens 0.1.0, Claude Code 2.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hooklens doctor`
      description: Remove anything private, such as paths or project names, before you paste.
      render: shell
